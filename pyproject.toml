[build-system]
requires = ["setuptools>=64", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "pathsim-rf"
dynamic = ["version"]
description = "RF Engineering toolbox for PathSim"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "PathSim Contributors"}
]
keywords = ["simulation", "RF engineering", "microwave", "signal processing"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "pathsim>=0.22",
    "numpy>=1.15",
    "scipy>=1.2",
    "scikit-rf>=0.30",
    "ElecSolver>=2.2.1",
    # If a dependency ships native code that can't be installed in Pyodide,
    # tag it with `; sys_platform != 'emscripten'` so a normal pip install
    # still pulls it eagerly but micropip in the browser skips it. Pair
    # this with a defensive re-export in `pathsim_rf/__init__.py`
    # (the `.network` submodule already follows this pattern).
]

[dependency-groups]
dev = [
  { include-group = "docs" },
  { include-group = "test" },
]
test = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]
docs = [
    "sphinx>=7.0",
    "furo",
    "myst-parser",
    "sphinx-copybutton",
    "sphinx-design",
]

[project.urls]
Homepage = "https://pathsim.org"
Documentation = "https://docs.pathsim.org/rf"
Repository = "https://github.com/pathsim/pathsim-rf"
Issues = "https://github.com/pathsim/pathsim-rf/issues"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools_scm]
write_to = "src/pathsim_rf/_version.py"
